name: probe-route-job
on:
  pull_request:
permissions: {}
jobs:
  direct:
    runs-on: ${{ vars.GATE_ROUTE == 'pool' && fromJSON(format('["self-hosted","gate","gate-{0}","run-{1}-{2}-{3}"]', vars.GATE_ARCH, github.run_id, github.job, strategy.job-index)) || 'ubuntu-latest' }}
    steps:
      - run: echo direct
  matrixed:
    strategy:
      matrix:
        leg: [a, b]
    runs-on: ${{ vars.GATE_ROUTE == 'pool' && fromJSON(format('["self-hosted","gate","gate-{0}","run-{1}-{2}-{3}"]', vars.GATE_ARCH, github.run_id, github.job, strategy.job-index)) || 'ubuntu-latest' }}
    steps:
      - run: echo matrixed
  called:
    uses: ./.github/workflows/probe-route-job-called.yml
