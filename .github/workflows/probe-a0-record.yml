name: probe-a0-record
# A0 trial 9 (26.11.2026): a job that names an environment leaves a deployment record; the record must still be listed
# after this file is deleted (the control for Plan A v8 A6's read of deployment records).
on:
  push:
    branches: ['probe/a0-record']
permissions: {}
jobs:
  record:
    runs-on: ubuntu-latest
    environment: probe-a0-record
    steps:
      - run: echo "a deployment record for A0 trial 9"
