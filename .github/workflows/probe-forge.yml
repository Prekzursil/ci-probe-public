name: probe-forge
on:
  pull_request:
permissions:
  statuses: write
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 45
      - run: >
          gh api -X POST repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}
          -f state=success -f context=probe-integrity -f description="same name from the PR"
        env:
          GH_TOKEN: ${{ github.token }}
